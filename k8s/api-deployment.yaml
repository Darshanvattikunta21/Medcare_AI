apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare-ai-api
  namespace: default
  labels:
    app: medicare-ai-api
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: medicare-ai-api
  template:
    metadata:
      labels:
        app: medicare-ai-api
        version: v1
    spec:
      containers:
      - name: api
        image: medicareai-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: APP_ENV
          value: "production"
        - name: PORT
          value: "4000"
        - name: PERSISTENCE_PROVIDER
          value: "database"
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: medicare-ai-config
              key: cors-origin
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: medicare-ai-secrets
              key: database-url
        - name: API_DATA_FILE
          value: "/app/data/db.json"
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: medicare-ai-data
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: medicare-ai-api
  namespace: default
  labels:
    app: medicare-ai-api
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: medicare-ai-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: medicare-ai-config
  namespace: default
data:
  cors-origin: "https://medicareai.com,https://app.medicareai.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: medicare-ai-secrets
  namespace: default
type: Opaque
stringData:
  database-url: "postgresql://medicare:replace-me@postgres:5432/medicare_ai?schema=public"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medicare-ai-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast
